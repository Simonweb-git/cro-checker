<html lang="en">
<head><title>Contact — Northwind Advisory</title></head>

</header>
<main>
  <section class="hero">
    <h1>Talk to a partner</h1>
    <p>Tell us where your pipeline is stalling and we will come back within two working days.</p>
  </section>
  <form action="/submit" method="post">
    <input type="text" name="name" placeholder="Name">
    <input type="email" name="email" placeholder="Work email">
    <input type="text" name="company" placeholder="Company">
    <input type="text" name="role" placeholder="Role">
    <input type="text" name="employees" placeholder="Number of employees">
    <input type="text" name="revenue" placeholder="Annual revenue">
    <input type="text" name="budget" placeholder="Budget range">
    <textarea name="message" placeholder="What are you trying to solve?"></textarea>
    <button type="submit">Send enquiry</button>
  </form>
</main>
<footer class="site-footer">
